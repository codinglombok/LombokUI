# Mandiri sementara (TD-02/TD-P0-08): ganti dengan pemanggil lombok-ci.yml dari codinglombok/.github.
# Setiap action di-pin ke SHA commit; Dependabot (.github/dependabot.yml) memperbaruinya.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: typescript
      - run: npm run typecheck
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm pack --dry-run
        working-directory: typescript
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        working-directory: python
      - name: wheel builds and installs
        run: python -m pip install build && python -m build && python -m pip install dist/*.whl && python -c "import lombokui; print(lombokui.VERSION)"
        working-directory: python
        shell: bash
  php:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
      - run: composer validate --no-check-publish
        working-directory: php
      - run: php tests/run_vectors.php
        working-directory: php
      - run: php tests/examples.php
        working-directory: php
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: typescript
      - name: vectors are reproducible from the generator
        run: node scripts/gen-vectors.mjs && git diff --exit-code vectors/
      - name: mutation test
        run: node scripts/mutation-test.mjs
      - name: lombok doctor
        run: bash scripts/lombok-doctor.sh LombokUI
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: typescript coverage (lines 95, functions 95, branches 90)
        run: npm ci && npm run coverage
        working-directory: typescript
      - name: python coverage (95)
        run: python -m pip install coverage && python -m coverage run --source=src/lombokui -m unittest discover -s tests && python -m coverage report --fail-under=95
        working-directory: python
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: typescript
      - name: install Chromium for playwright-core
        run: npx playwright-core install --with-deps chromium
        working-directory: typescript
      - name: end-to-end flows in Chromium
        run: npm run test:browser
        working-directory: typescript
